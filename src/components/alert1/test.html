<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0" />
  <title>Alert Comparison</title>

  <style>
    .alert-box {
      width: 320px;
      border-radius: 6px;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .alert-header {
      background-color: #ef4444;
      color: white;
      font-weight: bold;
      padding: 10px 16px;
    }

    .alert-body {
      background-color: #fee2e2;
      border: 1px solid #f87171;
      border-top: none;
      padding: 12px 16px;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="alert-box">
    <div class="alert-header">
      Dev Studio
    </div>
    <div class="alert-body">
      <p>Something not ideal might be happening.</p>
    </div>
  </div>

</body>
</html>
